<!doctype html>
<html lang="en" class="has-background-white-ter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
  />
  <body>
   <div class="container m-6">
    <div class="columns">
      <div class="column is-half is-offset-one-quarter">
         <div class="box" id="nameBox">
          <div class="mb-2">Enter your name</div>
           <div class="is-flex">
            <input id="input" class="input mr-4" type="text">
            <button class="button" onclick="start()">Start</button>
           </div>
          </div>
    <div style="display: none;" id="healthBar" class="box">
      <div id="nameTarget"></div>
       
     <progress id="health" class="progress is-danger" value="20" max="100">
     </progress>
     <div class="buttons">
      <button class="button is-success" onclick="heal()">heal</button>
      <button class="button is-danger" onclick="attack()">Attack</button>

        </div>
      </div>
    </div>
  </div>
</div>
  
    <script>
     function start(){

      const healthEl = document.getElementById("healthBar");
      healthEl.style.display ="block"

      const nameEl = document.getElementById("nameBox");
      nameEl.style.display = "none"

      const inputEl = document.getElementById("input");
      const myName=inputEl.value;

      document.getElementById("nameTarget").textContent = myName

     }
     function heal(){
      console.log("healing")
      const healthEl = document.getElementById("health");
      const myhealth=healthEl.value
      console.log(myhealth)
      healthEl.value= healthEl.value + 10;
     }
     function attack(){
      console.log("attacking")
      const healthEl = document.getElementById("health");
      const myhealth=healthEl.value
      console.log(myhealth)
      healthEl.value= healthEl.value - 10;

     }
    </script>
  </body>
</html>
